on:
    push:
    pull_request:
    create:
  
name: Continuous Integration - Testing Wheels on JRE
jobs:
  build_test_jar:
    runs-on: 'ubuntu-latest'
    steps:

      - name: Checkout pyjnius
        uses: actions/checkout@v7

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: 'x64'

      - name: Setup ant on Linux
        run: |
          sudo apt-get update && sudo apt-get install -y ant

      - name: Build test-classes via ant
        run: ant all

      - name: Upload test-classes
        uses: actions/upload-artifact@v7
        with:
          name: test-classes
          path: build/test-classes

  build_wheels:
    name: cibuildwheel
    env:
      CIBW_BUILD: 'cp311-*'
      CIBW_BEFORE_ALL_LINUX: 'yum install -y java-11-openjdk-devel'
      CIBW_REPAIR_WHEEL_COMMAND_MACOS: ''
      CIBW_SKIP: 'cp36-* *musllinux*'
    runs-on: 'ubuntu-latest'
    steps:

      - name: Checkout pyjnius
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install cibuildwheel & build wheels
        env:
          CIBW_ARCHS: 'x86_64'
        run: |
          python -m pip install cibuildwheel~=3.1.1
          python -m cibuildwheel --output-dir dist

      - name: upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  test_wheels:
    name: Test wheel
    needs:
      - build_wheels
      - build_test_jar
    runs-on: 'ubuntu-latest'
    steps:

      - name: Checkout pyjnius
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: test-classes
          path: build/test-classes

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          java-package: 'jre'

      - name: Install pyjnius wheel + test prerequisites
        run: |
          python -m pip install --find-links=dist --no-index pyjnius
          python -m pip install pyjnius[dev,ci]

      - name: Test wheel
        run: |
          cd tests
          CLASSPATH=../build/test-classes:../build/classes python -m pytest -v
