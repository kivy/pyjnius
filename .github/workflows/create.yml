on:
  push:
  pull_request:
  create:

name: Continuous Delivery
jobs:
  preflight:
    runs-on: ubuntu-latest
    # Keep the job successful on push/PR; skipping it would skip dependent builds.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        with:
          python-version: '3.15'
      - name: Check release tag against package version
        if: github.event_name == 'create' && github.event.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python .github/scripts/check_release_version.py "$RELEASE_TAG"

  build_wheels:
    name: cibuildwheel on ${{ matrix.os }} ${{ matrix.architecture }}
    if: (github.event_name == 'create' && github.event.ref_type == 'tag') || contains(github.event.head_commit.message, '[build wheel]') || contains(github.event.pull_request.title, '[build wheel]')
    needs: preflight
    env:
      CIBW_BEFORE_ALL_LINUX: 'yum install -y java-11-openjdk-devel'
      CIBW_REPAIR_WHEEL_COMMAND_MACOS: ''
      # The JVM is supplied by the user's JDK at runtime, not bundled in the wheel.
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: 'delvewheel repair --exclude jvm.dll -w {dest_dir} -v {wheel}'
      CIBW_BUILD: 'cp3{11,12,13,14}-*'
      CIBW_SKIP: '*musllinux*'
    strategy:
      matrix:
        include:
          - os: windows-latest
            architecture: 'x86'
            cibw_archs: 'x86'
          - os: windows-latest
            architecture: 'x64'
            cibw_archs: 'AMD64'
          - os: ubuntu-latest
            architecture: 'x64'
            cibw_archs: 'x86_64'
          - os: ubuntu-24.04-arm
            architecture: 'aarch64'
            cibw_archs: aarch64
          - os: macos-latest
            architecture: 'x64'
            cibw_archs: 'x86_64 universal2'
    runs-on: ${{ matrix.os }}
    steps:

      - name: Checkout pyjnius
        uses: actions/checkout@v7

      - name: Setup Python (Ubuntu x86_64, macOS Intel, Windows x86_64)
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Setup java
        # There's no need to setup java on ubuntu-latest, as build is done into a manylinux
        # containerized environment. (CIBW_BEFORE_ALL_LINUX) takes care of it.
        if: ${{ matrix.os  != 'ubuntu-latest' }}
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: ${{ matrix.architecture }}

      - name: Install cibuildwheel & build wheels (Windows)
        if: matrix.os == 'windows-latest'
        env:
          CIBW_ARCHS: '${{ matrix.cibw_archs }}'
        run: |
          python -m pip install 'cibuildwheel==4.3.0'
          python -m cibuildwheel --output-dir dist

      - name: Install cibuildwheel & build wheels (Linux, macOS Intel)
        if: (matrix.os == 'ubuntu-latest') || (matrix.os == 'ubuntu-24.04-arm') ||  (matrix.os == 'macos-latest')
        env:
          CIBW_ARCHS: '${{ matrix.cibw_archs }}'
        run: |
          python -m pip install 'cibuildwheel==4.3.0'
          python -m cibuildwheel --output-dir dist

      - name: upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.architecture }}
          path: dist

  build_sdist:
    name: Build sdist
    if: (github.event_name == 'create' && github.event.ref_type == 'tag') || contains(github.event.head_commit.message, '[build sdist]') || contains(github.event.pull_request.title, '[build sdist]')
    needs: preflight
    runs-on: 'ubuntu-latest'
    steps:
      - name: Checkout pyjnius
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Build sdist
        run: |
            pip install -U setuptools Cython
            python setup.py sdist

      - name: upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  test_wheels:
    name: Test wheel on ${{ matrix.os }} (${{ matrix.architecture }}) Python ${{ matrix.python }}
    if: (github.event_name == 'create' && github.event.ref_type == 'tag') || contains(github.event.head_commit.message, '[build wheel]') || contains(github.event.pull_request.title, '[build wheel]')
    needs:
      - build_wheels
    continue-on-error: true
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest', 'ubuntu-24.04-arm', 'macos-15-intel']
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          # We may would like to introduce tests also on windows-latest on x86 (win32 wheels)?
          # macos-latest runs on Apple Silicon,
          # macos-15-intel runs on Intel
          - os: ubuntu-latest
            architecture: 'x64'
            wheel_upload_pool: 'ubuntu-latest-x64'
          - os: ubuntu-24.04-arm
            architecture: 'aarch64'
            wheel_upload_pool: 'ubuntu-24.04-arm-aarch64'
          - os: windows-latest
            architecture: 'x64'
            wheel_upload_pool: 'windows-latest-x64'
          - os: macos-15-intel
            architecture: 'x64'
            wheel_upload_pool: 'macos-latest-x64'
          - os: macos-latest
            architecture: 'aarch64'
            wheel_upload_pool: 'macos-latest-x64'
    runs-on: ${{ matrix.os }}
    steps:

      - name: Checkout pyjnius
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.wheel_upload_pool }}
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: ${{ matrix.architecture }}

      - name: Setup ant on macOS
        if: (matrix.os == 'macos-latest') || (matrix.os == 'macos-15-intel')
        run: |
          brew install ant

      - name: Setup ant on Linux
        if: (matrix.os == 'ubuntu-latest') || (matrix.os == 'ubuntu-24.04-arm')
        run: |
          sudo apt-get update && sudo apt-get install -y ant

      - name: Build test-classes via ant
        run: ant all

      - name: Install pyjnius wheel + test prerequisites (Windows, macOS)
        if: matrix.os == 'windows-latest' || matrix.os == 'macos-latest' || matrix.os == 'macos-15-intel'
        # --find-links=dist --no-index is needed to avoid downloading the pyjnius wheel
        # from the index. We need to test the wheel we just built.
        run: |
          python -m pip install --find-links=dist --no-index pyjnius
          python -m pip install pyjnius[dev,ci]

      - name: Install pyjnius wheel + test prerequisites (Linux)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        # --find-links=dist --no-index is needed to avoid downloading the pyjnius wheel
        # from the index. We need to test the wheel we just built.
        run: |
          python -m pip install --find-links=dist --no-index pyjnius
          python -m pip install pyjnius[dev,ci]

      - name: Test wheel (Linux, macOS)
        if: (matrix.os == 'ubuntu-latest') || (matrix.os == 'ubuntu-24.04-arm') || (matrix.os == 'macos-latest') || (matrix.os == 'macos-15-intel')
        run: |
          cd tests
          CLASSPATH=../build/test-classes:../build/classes python -m pytest -v

      - name: Test wheel (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd tests
          $env:CLASSPATH ="../build/test-classes;../build/classes"
          python -m pytest -v
  

  test_wheel_windows_x86:
    name: Test win32 wheel on Python 3.14
    if: (github.event_name == 'create' && github.event.ref_type == 'tag') || contains(github.event.head_commit.message, '[build wheel]') || contains(github.event.pull_request.title, '[build wheel]')
    needs: build_wheels
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wheels-windows-latest-x86
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          architecture: x86

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          architecture: x86

      - name: Confirm 32-bit Python
        run: python -c "import struct; assert struct.calcsize('P') == 4"

      - name: Build test classes via ant
        run: ant all

      - name: Install win32 wheel from artifact
        run: python -m pip install --find-links=dist --no-index pyjnius

      - name: Install test prerequisites
        run: python -m pip install pyjnius[dev,ci]

      - name: Show installed pyjnius provenance
        run: python -m pip show pyjnius

      - name: Test win32 wheel with JVM
        run: |
          $env:PATH += ";$env:JAVA_HOME\jre\bin\server\;$env:JAVA_HOME\jre\bin\client\;$env:JAVA_HOME\bin\server\"
          $env:CLASSPATH = "../build/test-classes;../build/classes"
          cd tests
          python -m pytest -v

  release:
    if: (github.event_name == 'create' && github.event.ref_type == 'tag')
    name: release
    needs:
      - build_wheels
      - build_sdist
      - test_wheels
      - test_wheel_windows_x86
    runs-on: 'ubuntu-latest'
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true

    - name: Upload Test Release Asset
      id: create_test_release
      if: startsWith(github.ref, 'refs/tags/') && endsWith(github.ref, '-test')
      uses: softprops/action-gh-release@v3.0.3
      with:
        prerelease: true
        files: |
          dist/*.whl
          dist/*.zip
          dist/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Release Asset
      id: upload-release-asset
      if: startsWith(github.ref, 'refs/tags/') && ! endsWith(github.ref, '-test')
      uses: softprops/action-gh-release@v3.0.3
      with:
        files: |
          dist/*.whl
          dist/*.zip
          dist/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish package
      if: startsWith(github.ref, 'refs/tags/') && endsWith(github.ref, '-test')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_TOKEN_TEST }}
        repository_url: https://test.pypi.org/legacy/

    - name: Publish package
      if: startsWith(github.ref, 'refs/tags/') && ! endsWith(github.ref, '-test')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_TOKEN }}
